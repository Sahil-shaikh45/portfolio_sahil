<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Runtime Error Diagnostics -->
    <script type="text/javascript">
      window.onerror = function(message, source, lineno, colno, error) {
        var div = document.createElement('div');
        div.style.padding = '20px';
        div.style.background = '#ef4444';
        div.style.color = 'white';
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.zIndex = '999999';
        div.style.fontSize = '14px';
        div.style.fontFamily = 'monospace';
        div.style.boxShadow = '0 10px 15px -3px rgba(0,0,0,0.3)';
        div.style.overflow = 'auto';
        div.style.maxHeight = '50vh';
        div.innerHTML = '<strong>Deployment Diagnostics - JavaScript Error:</strong><br>' + 
                        message + '<br><br>' +
                        '<strong>Source:</strong> ' + source + ' (line ' + lineno + ', col ' + colno + ')<br>' +
                        '<strong>Stack Trace:</strong><br><pre style="white-space: pre-wrap; margin-top: 5px;">' + (error ? error.stack : 'N/A') + '</pre>';
        document.body.appendChild(div);
        return false;
      };
    </script>
    
    <!-- Primary SEO Meta Tags -->
    <title>Sahil Shaikh | Java Full Stack Developer</title>
    <meta name="title" content="Sahil Shaikh | Java Full Stack Developer" />
    <meta name="description" content="Portfolio of Sahil Shaikh, Java Full Stack Developer (MCA, Intern at SETTribe). Specialized in Java, Spring Boot, React, MySQL, AWS, and Algorithmic Trading." />
    <meta name="author" content="Sahil Shaikh" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sahil Shaikh | Java Full Stack Developer" />
    <meta property="og:description" content="Explore the portfolio of Sahil Shaikh, showcasing enterprise ERP modules, government field inspection portals, and trading systems." />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
  </head>
  <body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-sans transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
